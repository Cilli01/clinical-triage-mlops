# ci.yml — Pipeline de integracao e entrega continua.
#
# Quatro jobs, em cadeia:
#   lint:         checagem de estilo e formatacao (Ruff).
#   test:         suite de testes automatizados (pytest).
#   docker-build: valida que a imagem Docker builda corretamente.
#   deploy:       roda so no push direto na main (pos-merge) - na VPS via SSH,
#                 treina/exporta o modelo (nao versionado) e sobe/atualiza a
#                 stack (API + Prometheus + Grafana).
#
# Segredos necessarios para o job de deploy (Settings -> Secrets and
# variables -> Actions):
#   VPS_HOST         -> IP ou hostname da VPS
#   VPS_USER         -> usuario SSH
#   VPS_SSH_KEY      -> chave privada SSH (conteudo do arquivo ~/.ssh/id_rsa)
#   VPS_PROJECT_PATH -> caminho do projeto na VPS (ex: /home/usuario/clinical-triage-mlops)

name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Check Ruff Formatting
        run: uv run ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run tests
        run: uv run pytest -v

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t clinical-triage-api .

  deploy:
    name: Deploy na VPS
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Executar deploy na VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          # set -e: interrompe o script imediatamente se qualquer comando falhar.
          script: |
            set -e
            PROJECT_PATH="${{ secrets.VPS_PROJECT_PATH }}"
            REPO_URL="${{ github.server_url }}/${{ github.repository }}.git"

            echo "--- Verificando repositorio ---"
            # Clona o repositorio na primeira execucao; nas seguintes, so atualiza.
            if [ ! -d "$PROJECT_PATH/.git" ]; then
              echo "Repositorio nao encontrado. Clonando..."
              git clone "$REPO_URL" "$PROJECT_PATH"
            fi
            cd "$PROJECT_PATH"
            # O treino roda a cada deploy e nao e deterministico, entao
            # models/metrics.json sempre fica com diff local depois da
            # rodada anterior. Descarta antes de puxar pra o pull nunca
            # travar por causa de um artefato gerado, nao editado a mao.
            git reset --hard HEAD
            git pull origin main

            echo "--- Preparando ambiente Python (uv) ---"
            export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
            if ! command -v uv >/dev/null 2>&1; then
              echo "uv nao encontrado, instalando..."
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
            fi

            echo "--- Treinando o modelo ---"
            # O Dockerfile espera o artefato em models/, mas ele e gitignored
            # (nao versionamos binario). Como os CSVs de treino estao no repo,
            # treinamos aqui antes do build da imagem. Com o extra "optimize"
            # instalado, train.py ja exporta pra ONNX automaticamente.
            uv sync --extra optimize --frozen
            uv run python -m src.model.train

            echo "--- Construindo e subindo a stack ---"
            # up -d --build garante que os containers usem a imagem recem-buildada
            # mesmo que ja estivessem rodando.
            docker compose up -d --build

            echo "--- Verificando status dos containers ---"
            docker compose ps

            echo "--- Deploy concluido ---"